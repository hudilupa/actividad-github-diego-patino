<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>

<body>

    <h1>Formulario de Registro</h1>

    <form id="formRegistro">

        <!-- Nombre completo -->
        <label for="nombre">Nombre completo:</label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            required
        >

        <br><br>


        <!-- Correo electrónico -->
        <label for="correo">Correo electrónico:</label>

        <input
            type="email"
            id="correo"
            name="correo"
            required
        >

        <br><br>


        <!-- Contraseña -->
        <label for="contrasena">Contraseña:</label>

        <input
            type="password"
            id="contrasena"
            name="contrasena"
            required
        >

        <br><br>


        <!-- Edad -->
        <label for="edad">Edad:</label>

        <input
            type="number"
            id="edad"
            name="edad"
            min="18"
            max="100"
            required
        >

        <br><br>


        <!-- Fecha de nacimiento -->
        <label for="fechaNacimiento">Fecha de nacimiento:</label>

        <input
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            required
        >

        <br><br>


        <!-- Género -->
        <p>Género:</p>

        <input
            type="radio"
            id="masculino"
            name="genero"
            value="masculino"
        >

        <label for="masculino">
            Masculino
        </label>


        <input
            type="radio"
            id="femenino"
            name="genero"
            value="femenino"
        >

        <label for="femenino">
            Femenino
        </label>

        <br><br>


        <!-- Intereses -->
        <p>Intereses:</p>

        <input
            type="checkbox"
            id="videojuegos"
            name="intereses"
            value="videojuegos"
        >

        <label for="videojuegos">
            Videojuegos
        </label>


        <input
            type="checkbox"
            id="musica"
            name="intereses"
            value="musica"
        >

        <label for="musica">
            Música
        </label>


        <input
            type="checkbox"
            id="deportes"
            name="intereses"
            value="deportes"
        >

        <label for="deportes">
            Deportes
        </label>

        <br><br>


        <!-- Fotografía de perfil -->
        <label for="foto">Fotografía de perfil:</label>

        <input
            type="file"
            id="foto"
            name="foto"
        >

        <br><br>


        <!-- Color favorito -->
        <label for="color">Color favorito:</label>

        <input
            type="color"
            id="color"
            name="color"
        >

        <br><br>


        <!-- Nivel de satisfacción -->
        <label for="satisfaccion">
            Nivel de satisfacción:
        </label>

        <input
            type="range"
            id="satisfaccion"
            name="satisfaccion"
            min="1"
            max="10"
        >

        <br><br>


        <!-- Botón Registrar -->
        <button type="submit">
            Registrar
        </button>

    </form>

</body>

</html>
